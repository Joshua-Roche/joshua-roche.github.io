# Builds the app with Shinylive and publishes it to GitHub Pages.
# Uses Posit's reusable workflow: https://github.com/posit-dev/r-shinylive/tree/actions-v1/examples
# In the repository, set Settings -> Pages -> Source to "GitHub Actions".
name: Deploy app to gh-pages

on:
  # Run by hand from the Actions tab
  workflow_dispatch:
  # Run on every push to main
  push:
    branches: ["main"]
  # Check pull requests build (they are not deployed)
  pull_request:

jobs:
  shinylive:
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    # Permissions needed for a Pages deployment
    permissions:
      pages: write
      id-token: write
